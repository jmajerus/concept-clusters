<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concept Clusters</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Karla:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Concept Clusters</h1>
      <div class="controls">
        <select id="puzzle-picker" aria-label="Choose a puzzle"></select>
        <button id="browse-puzzles">Browse puzzles</button>
        <div id="puzzle-controls">
          <button id="reset">Start over</button>
          <button id="show-solution">Show solution</button>
          <button id="share-puzzle">Share</button>
          <span id="share-status" role="status"></span>
        </div>
      </div>
    </header>

    <div id="puzzle-overview">
      <img id="overview-logo" src="concept-clusters.png" alt="">
      <h2 id="overview-title"></h2>
      <p id="overview-subtitle"></p>
      <div id="overview-list"></div>
      <div class="overview-share">
        <button id="overview-share-btn">Share this set</button>
        <span id="overview-share-status" role="status"></span>
      </div>
    </div>

    <div id="puzzle-view">
      <div class="mode-bar" role="group" aria-label="Rendering mode">
        <button id="mode-graph" class="mode-btn">Graph</button>
        <button id="mode-star" class="mode-btn">Star</button>
        <button id="mode-sets" class="mode-btn">Circle</button>
      </div>

      <div class="subhead">
        <span class="title-group">
          <span id="puzzle-title" tabindex="0"></span>
          <span id="large-badge" class="badge-large">Large</span>
        </span>
        <span id="progress"></span>
      </div>
      <div id="puzzle-info"></div>

      <svg id="board" viewBox="0 0 640 460" aria-label="Concept graph board"></svg>

      <div id="message" aria-live="polite"></div>
      <div id="term-info" aria-live="polite"></div>
      <div id="facts"></div>
      <div id="related-puzzles"></div>

      <footer>
        Tap a gray term, then tap a node in the cluster it belongs to.
        Dashed terms are bridges — they belong to two clusters and need a
        connection into each. <span id="drag-hint"></span>
      </footer>
    </div>
  </div>

  <!-- D3 is vendored locally so the game runs offline; swap for a CDN or npm install when migrating to a bundler -->
  <script src="d3.v7.min.js"></script>
  <script type="module" src="game.js"></script>
</body>
</html>
