name: Content validation

on:
  pull_request:
    paths:
      - "content/**"
      - "puzzles/**"
      - "catalogues/**"
      - "modules/**"
      - "src/authoring-worker.ts"
      - "d1/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "tools/ensure-puzzle-registry.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hosted puzzle PRs omit puzzles/index.js; materialize registrations
      # in the workspace so validate sees every on-disk module.
      - run: node tools/ensure-puzzle-registry.mjs
      - run: npm run validate
      - name: Validate canonical JSON-LD
        run: find content/puzzles -name '*.ccpuzzle.jsonld' -print0 | xargs -0 npm run content:check --
      - run: npm run test:worker
