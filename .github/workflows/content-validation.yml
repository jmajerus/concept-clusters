name: Content validation

on:
  pull_request:
    paths:
      - "content/**"
      - "puzzles/**"
      - "catalogues/**"
      - "modules/**"
      - "src/authoring-worker.ts"
      - "d1/migrations/**"
      - "package.json"
      - "package-lock.json"
      - "tools/ensure-puzzle-registry.mjs"
      - "tools/build-puzzle-manifest.mjs"
      - "tools/ensure-catalogue-registry.mjs"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the JSON-LD step below can diff against the
          # PR's base commit -- the default shallow clone only has HEAD.
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hosted puzzle/catalogue PRs omit puzzles/index.js and
      # catalogues/index.js; materialize registrations in the workspace so
      # validate sees every on-disk module.
      - run: node tools/ensure-puzzle-registry.mjs
      - run: node tools/ensure-catalogue-registry.mjs
      - run: npm run validate
      - name: Validate canonical content (files changed in this PR)
        # Deliberately scoped to this PR's diff, not the whole corpus: each
        # .ccpuzzle.json file is validated independently (cross-puzzle
        # references still resolve against the full registry loaded from
        # puzzles/index.js), so an unrelated PR shouldn't be blocked by
        # drift in a file it never touched. The full corpus is swept
        # separately by content-validation-full.yml on pushes to main that
        # touch its own paths filter (see that file).
        run: |
          git diff --name-only -z --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" \
            -- 'content/puzzles/*.ccpuzzle.json' > /tmp/changed-jsonld.list
          if [ -s /tmp/changed-jsonld.list ]; then
            xargs -0 npm run content:check -- < /tmp/changed-jsonld.list
          else
            echo "No canonical content changed in this PR; skipping."
          fi
      - run: npm run test:worker
