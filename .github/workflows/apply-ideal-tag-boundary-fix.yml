name: Apply ideal-tag boundary fix

on:
  push:
    branches:
      - agent/restoring-honest-choice

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger ideal-tag boundary fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restoring-honest-choice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused renderer edit
        run: node tools/apply-ideal-tag-boundary-fix.mjs
      - name: Validate syntax and schemas
        run: |
          node --check modules/starRenderer.js
          npm run validate
      - name: Commit completed fix
        run: |
          rm tools/apply-ideal-tag-boundary-fix.mjs
          rm .github/workflows/apply-ideal-tag-boundary-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep ideal annotations inside Star board"
          git push origin HEAD:agent/restoring-honest-choice
