name: Apply see-also renderer patch

on:
  push:
    branches:
      - agent/restoring-honest-choice

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger see-also renderer patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restoring-honest-choice
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply focused source edits
        run: node tools/apply-see-also-renderer-patch.mjs
      - name: Validate syntax and puzzle schemas
        run: |
          node --check game.js
          node --check modules/overviewRenderer.js
          node --check modules/termInfo.js
          node --check modules/puzzleGraph.js
          node --check tools/check-wiki-links.mjs
          npm run validate
      - name: Commit completed patch
        run: |
          rm tools/apply-see-also-renderer-patch.mjs
          rm .github/workflows/apply-see-also-renderer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Render ordered see-also links"
          git push origin HEAD:agent/restoring-honest-choice
