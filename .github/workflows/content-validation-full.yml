name: Content validation (full corpus)

# The per-PR "Content validation" workflow only checks JSON-LD files that PR
# actually touched, so it can't catch drift sitting in files nobody in that
# PR looked at. This sweeps every committed content/puzzles/*.ccpuzzle.jsonld
# file whenever a push to main touches one of the paths below, independent
# of any single PR.

on:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "modules/**"
      - "puzzles/**"
      - "tools/content-jsonld.mjs"
      - "tools/ensure-puzzle-registry.mjs"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  validate-all:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hosted puzzle PRs omit puzzles/index.js; materialize registrations
      # in the workspace so cross-puzzle references resolve correctly.
      - run: node tools/ensure-puzzle-registry.mjs
      - name: Validate canonical JSON-LD (full corpus)
        run: find content/puzzles -name '*.ccpuzzle.jsonld' -print0 | xargs -0 npm run content:check --
