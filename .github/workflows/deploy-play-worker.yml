name: Deploy game

# The public play Worker. Published rows reach players through D1; this
# deploy ships the Worker and the static site from main. Gameplay is
# reviewed on localhost and the LAN authoring server. The Deploy game
# button dispatches this workflow and does not upload the local checkout.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "modules/**"
      - "game.js"
      - "index.html"
      - "styles.css"
      - "_headers"
      - "d3.v7.min.js"
      - "puzzles/**"
      - "catalogues/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "tools/build-puzzle-manifest.mjs"
      - "d1/migrations/**"
      - "site/**"
      - ".github/workflows/deploy-play-worker.yml"

permissions:
  contents: read

concurrency:
  group: play-worker-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate D1 and deploy the play Worker
        run: npm run authoring:d1:migrate:remote && npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
