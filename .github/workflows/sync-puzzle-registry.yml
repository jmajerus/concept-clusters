name: Sync puzzle registry

# Hosted puzzle PRs omit puzzles/index.js to avoid GitHub merge conflicts.
# After a merge to main, register any on-disk modules still missing from the
# index and push a follow-up commit when needed.
#
# That commit is pushed with the default GITHUB_TOKEN, which GitHub Actions
# deliberately never lets trigger other on:push workflows (anti-recursion
# safety) -- including deploy-authoring-worker.yml, even though its own path
# filter (puzzles/**) would otherwise match. Left alone, that means the
# authoring Worker's bundled puzzle snapshot can lag a registry-sync commit
# indefinitely, not just briefly, refreshing only whenever some *unrelated*
# push happens to redeploy it. githubPublicationService.js's planDocument()
# now checks GitHub directly rather than trusting that snapshot for
# create-vs-replace and path decisions, so this gap is no longer able to
# cause the duplicate-registration failure it once did -- but the snapshot
# still drives list_puzzles/get_puzzle/list_catalogues/get_catalogue, so it's
# still worth closing promptly rather than leaving those stale. Deploy here
# directly instead of chaining through workflow_run, which would also fire
# (uselessly) on every no-op sync.
on:
  push:
    branches: [main]
    paths:
      - "puzzles/**"
      - "tools/ensure-puzzle-registry.mjs"

permissions:
  contents: write

concurrency:
  group: authoring-worker-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure puzzles/index.js
        run: node tools/ensure-puzzle-registry.mjs
      - name: Commit registry updates
        id: commit
        # The concurrency group above only serializes runs of this workflow;
        # it can't stop a plain PR merge from landing on main in the window
        # between this job's checkout and its push. When that happens the
        # push is rejected ("fetch first") and the registration this run
        # computed would otherwise be silently lost -- the job used to just
        # fail here, leaving puzzles/index.js (and the deployed authoring
        # Worker) permanently short a puzzle until someone noticed. Rebase
        # onto the new main and retry a few times instead of giving up on
        # the first race.
        run: |
          if git diff --quiet -- puzzles/index.js puzzles/manifest.js; then
            echo "Registry already complete."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add puzzles/index.js puzzles/manifest.js
          git commit -m "Register puzzle modules and refresh puzzles/manifest.js."
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest main and retrying."
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::Failed to push registry update after 5 attempts."
          exit 1
      - name: Migrate and deploy authoring worker
        if: steps.commit.outputs.changed == 'true'
        run: npm run mcp:hosted:release
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
