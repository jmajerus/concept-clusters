interface:
  display_name: "Author Puzzle"
  short_description: "Author and validate Concept Clusters puzzles"
  default_prompt: "Use $author-puzzle. When the subject is unnamed, run suggest-subject.mjs once. Default to inventory pass (save /tmp/<id>-inventory.json, check-completeness --level inventory), stop for human concept-map approval — do not write puzzle JSON until they say inventory approved or continue to fit. Fit pass: loss ledger at /tmp/<id>-fit.json, MCP core+review sequentially, check-completeness --level fit --ledger, validate, --record --authored, stop for board review. On continue/fill/complete, add notes and lenses (--level complete)."
dependencies:
  tools:
    - type: "mcp"
      value: "concept-clusters"
      description: "Workspace MCP server for puzzle drafts and validation"
      transport: "stdio"
policy:
  allow_implicit_invocation: false
