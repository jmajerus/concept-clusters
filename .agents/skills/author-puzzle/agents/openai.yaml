interface:
  display_name: "Author Puzzle"
  short_description: "Author and validate Concept Clusters puzzles"
  default_prompt: "Use $author-puzzle. With only profile=vocabulary-context or profile=trivia-quiz, treat it as ‘surprise me’: choose a compact subject, create and validate the complete draft, then stop for my review; never publish unless I ask."
dependencies:
  tools:
    - type: "mcp"
      value: "concept-clusters"
      description: "Workspace MCP server for puzzle drafts and validation"
      transport: "stdio"
policy:
  allow_implicit_invocation: false
