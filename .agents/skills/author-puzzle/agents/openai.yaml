interface:
  display_name: "Author Puzzle"
  short_description: "Author and validate Concept Clusters puzzles"
  default_prompt: "Use $author-puzzle. At every stop gate, prompt the human with numbered What's next? options — never require magic phrases; accept yes/continue/next board/revise in plain language. For splits, run plan-split-boards.mjs once per board, print humanPrompt verbatim, obey humanNext on their reply. Inventory → plan (when sizing/split) → fit → complete."
dependencies:
  tools:
    - type: "mcp"
      value: "concept-clusters"
      description: "Workspace MCP server for puzzle drafts and validation"
      transport: "stdio"
policy:
  allow_implicit_invocation: false
