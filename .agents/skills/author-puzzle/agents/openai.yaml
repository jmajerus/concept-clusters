interface:
  display_name: "Author Puzzle"
  short_description: "Author and validate Concept Clusters puzzles"
  default_prompt: "Use $author-puzzle. Inventory → plan (when sizing/split) → fit → complete. Inventory: no content/puzzles reads; /tmp/<id>-inventory.json; check-completeness --level inventory. Plan: plan-boards.mjs + /tmp/<id>-split-plan.json; check-completeness --level split. Fit: loss ledger, relatedPuzzles from plan, MCP core+review sequential; check-completeness --level fit --ledger. Complete: notes and lenses. Proceed on direct create/fit/go-ahead — no magic phrase."
dependencies:
  tools:
    - type: "mcp"
      value: "concept-clusters"
      description: "Workspace MCP server for puzzle drafts and validation"
      transport: "stdio"
policy:
  allow_implicit_invocation: false
